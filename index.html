<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingeniería Automotriz</title>

    <style>
        /* 1️⃣ Selector por etiqueta */
        body {
            background-color: #e6f2ff; /* cambia color de fondo */
            font-family: Arial, sans-serif;
        }

        h1 {
            color: darkblue; /* cambia color de texto */
            text-align: center;
        }

        p {
            color: #333;
        }

        /* 2️⃣ Selector por class */
        .grande {
            font-size: 22px;
        }

        .resaltado {
            color: red;
        }

        /* 3️⃣ Selector por id */
        #especial {
            font-family: 'Courier New', monospace;
            color: green;
        }
    </style>

</head>

<body>

    <h1>Ingeniería Automotriz</h1>

    <p class="grande">
        La ingeniería automotriz se encarga del diseño y fabricación de vehículos.
    </p>

    <p class="resaltado">
        Esta carrera combina mecánica, tecnología y electrónica.
    </p>

    <p id="especial">
        Los ingenieros automotrices desarrollan motores más eficientes y modernos.
    </p>

</body>
</html>

</body>
</html>
